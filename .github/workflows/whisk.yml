name: Whisk

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: whisk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  writing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          cache: true
      - run: vp i --frozen-lockfile
      - run: vp exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: vp run check:changed "$CHECK_BASE"
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: vp run --filter @t3tools/web build
