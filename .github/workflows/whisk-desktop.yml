name: Whisk desktop

# Builds unsigned desktop apps. A `whisk-v*` tag also attaches them to a draft
# release, which a maintainer reviews and publishes.
on:
  workflow_dispatch:
  push:
    tags: ["whisk-v*"]

permissions:
  contents: read

concurrency:
  group: whisk-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple silicon
            runner: macos-15
            platform: mac
            target: dmg
            arch: arm64
            rust: aarch64-apple-darwin
          - label: macOS Intel
            runner: macos-15-intel
            platform: mac
            target: dmg
            arch: x64
            rust: x86_64-apple-darwin
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            rust: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          cache: true
      - run: vp i --frozen-lockfile
      - run: rustup target add ${{ matrix.rust }}
      - if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config build-essential imagemagick
      # Unsigned apps cannot update themselves, so leave the update feed out.
      - run: >-
          env -u GITHUB_REPOSITORY node scripts/build-desktop-artifact.ts
          --platform ${{ matrix.platform }} --target ${{ matrix.target }} --arch ${{ matrix.arch }}
          --output-dir release --verbose
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: whisk-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/whisk-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - run: gh release create "$TAG" release/* --repo "$REPO" --draft --generate-notes --title "Whisk ${TAG#whisk-v}"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
